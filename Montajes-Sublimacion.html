function verTalla(t,origen){const cols=colsRes;if(!cols.length)return;
  const lista=S.clientes.map(cl=>({cl,p:piezas(cl,t)})).filter(x=>cols.some(d=>d.f(x.p)));
  const celda=(d,r)=>{const v=d.f(r);return `<td>${v?`<span class="pv num" style="--c:var(${d.c})">${d.v?d.v(r):v}</span>`:`<span class="pv0">—</span>`}</td>`};
  const tot=ZERO();lista.forEach(x=>{for(const k in tot)tot[k]+=x.p[k]});
  $("modal").innerHTML=`<div class="card ancho ajuste" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="toolbar"><div><h2 id="mt">Talla ${t}</h2><span class="note">${lista.length} cliente${lista.length===1?"":"s"} · haz clic en un cliente para abrir su pedido</span></div><button class="btn" id="rs-no">Cerrar</button></div>
    <div class="pwrap"><table class="ptt tcli"><thead><tr><th class="ptal" style="width:auto;text-align:left">Cliente</th>${cols.map(d=>`<th style="--c:var(${d.c})"><div class="ph">${chip(d.ic,d.c,1)}<span class="pl${d.id==="MCp"||d.id==="MLp"?" una":""}">${d.n}</span>${d.u?`<small>${d.u}</small>`:""}</div></th>`).join("")}</tr></thead>
    <tbody>${lista.map(x=>`<tr class="clic" data-abrir="${x.cl.id}"><th style="text-align:left"><b class="cnom">${esc(x.cl.nombre||"Sin nombre")}</b></th>${cols.map(d=>celda(d,x.p)).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  focoPrevio=origen||document.activeElement;$("modal").hidden=false;$("rs-no").focus()}
$("v-resumen").addEventListener("click",e=>{if(sinClick)return;const tr=e.target.closest("#tlt tbody tr[data-talla]");if(tr)verTalla(tr.dataset.talla,tr)});
$("modal").addEventListener("click",e=>{const tr=e.target.closest("tr[data-abrir]");if(!tr)return;sel=tr.dataset.abrir;confirmDel=false;tallasFijas=null;
  cerrarModal();location.hash="pedidos";renderLista();renderEditor()});

/* ---------- detalle de un lote en una ventana ---------- */
function verLote(id,origen){const l=LOTES.find(x=>x.id===id);if(!l)return;
  const filas=(l.clientes||[]).map(c=>{normCli(c);const s=sumCliente(c,l.ajustes);return `<tr><th style="text-align:left;font-size:13px">${esc(c.nombre)}</th><td class="num">${c.pedido?fecha(c.pedido):"·"}</td><td class="num">${c.entrega?fecha(c.entrega):"·"}</td>${cell(s.C+s.L)}${cell(s.SM)}${cell(s.F)}${cell(s.E)}${cell(s.mcU+s.mlU+s.mqU)}${cell(s.SH)}${cell(s.total,1)}</tr>`}).join("");
  const r=l.resumen||{};
  $("modal").innerHTML=`<div class="card ancho" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="toolbar"><div><h2 id="mt">${esc(l.nombre)}</h2><span class="note">${fecha(l.fecha)} · ${r.clientes||0} clientes · ${r.piezas||0} piezas</span></div><button class="btn" id="rs-no">Cerrar</button></div>
    <div class="gridwrap"><table class="rt"><thead><tr><th style="text-align:left">Cliente</th><th>Pedido</th><th>Entrega</th><th>Completas</th><th>Franelillas</th><th>Frentes</th><th>Espaldas</th><th>Mangas</th><th>Shorts</th><th>Piezas</th></tr></thead><tbody>${filas}</tbody></table></div></div>`;
  focoPrevio=origen||document.activeElement;$("modal").hidden=false;$("rs-no").focus()}

/* ---------- reiniciar / deshacer ---------- */
$("btnUndo").addEventListener("click",deshacer);
$("btnRedo").addEventListener("click",rehacer);
document.addEventListener("keydown",e=>{
  if(!(e.ctrlKey||e.metaKey)||e.altKey)return;const k=e.key.toLowerCase();
  if(k==="z"&&!e.shiftKey){e.preventDefault();deshacer()}
  else if(k==="y"||(k==="z"&&e.shiftKey)){e.preventDefault();rehacer()}
});
let focoPrevio=null,admK=null;
function cerrarModal(){$("modal").hidden=true;admK=null;const f=focoPrevio||$("btnReset");focoPrevio=null;if(f&&document.contains(f))f.focus()}
function usosDe(k,v){return S.clientes.filter(c=>k==="detalles"?(c.req.extras||[]).includes(v):c.req[k]===v).length}
let admEdit=null;
function pintarAdm(){
  const k=admK;const m=$("modal");const esDet=k==="detalles";
  const items=esDet?DETS().map(d=>({id:d.k,n:d.n,p:d.p})):(S.ajustes.listas[k]||[]).map(o=>({id:o,n:o}));
  const apSel=(id,v,cls)=>`<select${id?` id="${id}"`:""}${cls?` class="${cls}"`:""} aria-label="Aplica a">${Object.entries(APLICA).map(([a,t])=>`<option value="${a}"${a===v?" selected":""}>${t}</option>`).join("")}</select>`;
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Editar lista: ${LISTA_NOM[k]}</h2>
    <p class="note">Haz clic en un nombre para cambiarlo. Arrastra los puntos de la izquierda para cambiar el orden.${esDet?" Elige a qué prendas aplica cada detalle.":""}</p>
    <div class="adm" id="admList">${items.length?items.map(it=>{const u=usosDe(k,it.id);
      return `<div class="row" data-id="${esc(it.id)}"><span class="grip" title="Arrastra para mover">${ico("grip")}</span><input class="nm" value="${esc(it.n)}" data-orig="${esc(it.n)}" aria-label="Nombre de la opción" autocomplete="off">${esDet?apSel("",it.p,"ap"):""}<button class="btn sm danger" data-quitar="${esc(it.id)}">Quitar</button></div>`}).join(""):`<p class="note">La lista está vacía.</p>`}</div>
    <form class="addopt" id="admForm"><input id="admNew" placeholder="Nueva opción…" autocomplete="off" aria-label="Nueva opción">${esDet?apSel("admAp","todo"):""}<button class="btn" type="submit">Agregar</button><button class="btn primary" type="button" id="admOk">Listo</button></form></div>`;
}
/* guarda el nombre editado directamente en la fila */
function guardarNombre(inp){const k=admK;if(!k)return;const row=inp.closest(".row");const id=row.dataset.id;const old=inp.dataset.orig;const v=inp.value.trim();
  if(v===old)return;
  if(!v){inp.value=old;toast("El nombre no puede quedar vacío.");return}
  if(k==="detalles"){if(DETS().some(d=>d.k!==id&&d.n.toLowerCase()===v.toLowerCase())){inp.value=old;toast("Ese detalle ya está en la lista.");return}
    const d=S.ajustes.detalles.find(x=>x.k===id);if(!d)return;d.n=v}
  else{const L=S.ajustes.listas[k];if(L.some(o=>o!==id&&o.toLowerCase()===v.toLowerCase())){inp.value=old;toast("Esa opción ya está en la lista.");return}
    const ix=L.indexOf(id);if(ix<0)return;L[ix]=v;S.clientes.forEach(c=>{if(c.req[k]===id)c.req[k]=v});row.dataset.id=v;
    const q=row.querySelector("[data-quitar]");if(q)q.dataset.quitar=v}
  inp.value=v;inp.dataset.orig=v;changed();renderEditor();renderProduccion();toast("Opción actualizada.",{txt:"Deshacer",fn:()=>{deshacer();if(admK)pintarAdm()}})}
$("modal").addEventListener("focusout",e=>{if(e.target.classList&&e.target.classList.contains("nm"))guardarNombre(e.target)});
$("modal").addEventListener("change",e=>{if(!(e.target.classList&&e.target.classList.contains("ap"))||admK!=="detalles")return;
  const d=S.ajustes.detalles.find(x=>x.k===e.target.closest(".row").dataset.id);if(!d)return;d.p=e.target.value;changed();renderProduccion()});
$("modal").addEventListener("keydown",e=>{if(!(e.target.classList&&e.target.classList.contains("nm")))return;
  if(e.key==="Enter"){e.preventDefault();e.target.blur()}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();e.target.value=e.target.dataset.orig;e.target.blur()}});
function abrirAdm(k,origen){focoPrevio=origen||document.activeElement;admK=k;admEdit=null;pintarAdm();$("modal").hidden=false;$("admNew").focus()}
function trasAdm(){renderEditor();renderProduccion();pintarAdm();$("admNew").focus()}
$("modal").addEventListener("submit",e=>{e.preventDefault();if(!admK)return;const v=$("admNew").value.trim();if(!v){$("admNew").focus();return}
  if(admK==="detalles"){if(DETS().some(d=>d.n.toLowerCase()===v.toLowerCase())){toast("Ese detalle ya está en la lista.");return}
    S.ajustes.detalles.push({k:"d"+uid(),n:v,p:$("admAp").value})}
  else{const L=S.ajustes.listas[admK];if(L.some(o=>o.toLowerCase()===v.toLowerCase())){toast("Esa opción ya está en la lista.");return}L.push(v)}
  changed();trasAdm();toast(`“${v}” agregado.`)});
$("btnReset").addEventListener("click",()=>{
  const n=S.clientes.length;const m=$("modal");
  if(!n){toast("No hay clientes para reiniciar.");return}
  m.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Reiniciar pedidos</h2>
    <p class="note">Elige qué quieres borrar. Podrás deshacerlo con el botón Deshacer o con Ctrl+Z.</p>
    <div class="opts">
      <button class="opt" id="rs-cero" role="checkbox" aria-checked="false"><i class="ck"></i><div><b>Poner todas las cantidades en cero</b><span>Conserva los ${n} clientes, sus diseños e indicaciones.</span></div></button>
      <button class="opt danger" id="rs-todo" role="checkbox" aria-checked="false"><i class="ck"></i><div><b>Eliminar los ${n} clientes</b><span>Borra clientes y cantidades. El historial de lotes no se toca.</span></div></button>
    </div>
    <p class="note" id="rs-res">Marca una o ambas opciones.</p>
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" id="rs-no">Cancelar</button><button class="btn primary" id="rs-ok" disabled>Aceptar</button></div></div>`;
  m.hidden=false;$("rs-no").focus();
});
$("modal").addEventListener("click",e=>{
  if(e.target.id==="modal"){cerrarModal();return}
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="rs-no"||b.id==="admOk"){cerrarModal();return}
  if(b.dataset.editar!==undefined&&admK){admEdit=b.dataset.editar;pintarAdm();const i=$("admEd");if(i){i.focus();i.select()}return}
  if(b.hasAttribute("data-cancelar")){admEdit=null;pintarAdm();return}
  if(b.hasAttribute("data-guardar")){guardarEdicion();return}
  if(b.dataset.quitar!==undefined&&admK){const id=b.dataset.quitar;
    if(admK==="detalles"){const d=det(id);S.ajustes.detalles=S.ajustes.detalles.filter(x=>x.k!==id);S.clientes.forEach(c=>{c.req.extras=(c.req.extras||[]).filter(x=>x!==id)});changed();trasAdm();toast(`“${d.n}” quitado de la lista.`,{txt:"Deshacer",fn:()=>{deshacer();if(admK)pintarAdm()}})}
    else{S.ajustes.listas[admK]=S.ajustes.listas[admK].filter(o=>o!==id);changed();trasAdm();toast(`“${id}” quitado de la lista.`,{txt:"Deshacer",fn:()=>{deshacer();if(admK)pintarAdm()}})}
    return}
  if(b.id==="rs-cero"||b.id==="rs-todo"){
    b.setAttribute("aria-checked",b.getAttribute("aria-checked")!=="true");
    const z=$("rs-cero").getAttribute("aria-checked")==="true",d=$("rs-todo").getAttribute("aria-checked")==="true";
    $("rs-ok").disabled=!(z||d);$("rs-ok").classList.toggle("danger-fill",d);
    $("rs-res").textContent=d&&z?"Se pondrán las cantidades en cero y se eliminarán todos los clientes.":d?"Se eliminarán todos los clientes con sus cantidades.":z?"Se pondrán todas las cantidades en cero.":"Marca una o ambas opciones.";
    return}
  if(b.id==="rs-ok"){
    const z=$("rs-cero").getAttribute("aria-checked")==="true",d=$("rs-todo").getAttribute("aria-checked")==="true";if(!z&&!d)return;
    if(z)S.clientes.forEach(c=>c.q={});
    if(d){S.clientes=[];sel=null;prodSel=null;S.loteActivo=null}
    renderTodo();changed();$("modal").hidden=true;
    toast(d?"Clientes eliminados.":"Cantidades en cero.",{txt:"Deshacer",fn:deshacer});return}
});
/* Esc: cierra la ventana abierta; si no hay ninguna, quita el cursor del campo activo */
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;
  if(!$("dp").hidden){e.preventDefault();cerrarDP(true);return}
  if(!$("modal").hidden){e.preventDefault();cerrarModal();return}
  const a=document.activeElement;if(a&&a!==document.body&&a.blur){e.preventDefault();a.blur();try{window.getSelection().removeAllRanges()}catch(_){}}
});

/* ---------- modo claro / oscuro ---------- */
const mq=window.matchMedia("(prefers-color-scheme: dark)");
function esOscuro(){const a=document.documentElement.getAttribute("data-theme");return a?a==="dark":mq.matches}
function pintarBoton(){const d=esOscuro();const b=$("themeBtn");b.dataset.dark=d;b.setAttribute("aria-label",d?"Cambiar a modo claro":"Cambiar a modo oscuro")}
try{const t=localStorage.getItem("montajes-tema");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(_){}
$("themeBtn").addEventListener("click",()=>{const nuevo=esOscuro()?"light":"dark";document.documentElement.setAttribute("data-theme",nuevo);try{localStorage.setItem("montajes-tema",nuevo)}catch(_){}pintarBoton()});
try{mq.addEventListener("change",pintarBoton)}catch(_){}
new MutationObserver(pintarBoton).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
pintarBoton();

renderHeader();vista();renderTodo();iniciar();
})();
</script>
</body></html>
